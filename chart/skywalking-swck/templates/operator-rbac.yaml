# The service account, roles and bindings of the operator. The rules of the
# manager ClusterRole itself are NOT here -- they are generated by controller-gen
# from the +kubebuilder:rbac markers in the operator sources, and live in the
# generated operator-manager-role.yaml.
{{- if not .Values.operator.serviceAccount.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "swck.operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "swck.componentName" (list . "leader-election-role") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "swck.componentName" (list . "leader-election-rolebinding") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "swck.componentName" (list . "leader-election-role") }}
subjects:
- kind: ServiceAccount
  name: {{ include "swck.operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "swck.componentName" (list . "manager-rolebinding") }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "swck.componentName" (list . "manager-role") }}
subjects:
- kind: ServiceAccount
  name: {{ include "swck.operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- if .Values.operator.metrics.enabled }}
---
# The kube-rbac-proxy sidecar authorises scrapes by issuing TokenReviews and
# SubjectAccessReviews, which is what proxy-role grants it. metrics-reader is the
# other half: the role a scraper (Prometheus, a human with kubectl) is bound to
# in order to be allowed through the proxy. The chart creates it but binds it to
# nothing -- who may scrape is the cluster operator's decision.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "swck.componentName" (list . "proxy-role") }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "swck.componentName" (list . "proxy-rolebinding") }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "swck.componentName" (list . "proxy-role") }}
subjects:
- kind: ServiceAccount
  name: {{ include "swck.operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "swck.componentName" (list . "metrics-reader") }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
{{- end }}
