# The ControllerManagerConfig the manager is started with, mirroring
# operator/config/manager/controller_manager_config.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "swck.componentName" (list . "manager-config") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
data:
  controller_manager_config.yaml: |
    apiVersion: controller-runtime.sigs.k8s.io/v1alpha1
    kind: ControllerManagerConfig
    health:
      healthProbeBindAddress: :8081
    metrics:
      # 127.0.0.1 on purpose: the endpoint is reachable only from inside the pod,
      # so the kube-rbac-proxy sidecar is the only way to scrape it. "0" turns the
      # metrics server off entirely, which is what operator.metrics.enabled=false
      # asks for.
      bindAddress: {{ if .Values.operator.metrics.enabled }}127.0.0.1:8080{{ else }}"0"{{ end }}
    {{- if .Values.operator.webhook.enabled }}
    webhook:
      port: {{ .Values.operator.webhook.service.port }}
    {{- end }}
    leaderElection:
      leaderElect: true
      resourceName: v1alpha1.swck.skywalking.apache.org
