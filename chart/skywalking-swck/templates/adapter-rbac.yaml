{{- if .Values.adapter.enabled }}
{{- if not .Values.adapter.serviceAccount.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "swck.adapter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
---
{{- end }}
# An aggregated apiserver has to delegate authn/authz to the main apiserver...
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "swck.componentName" (list . "custom-metrics-auth-delegator") }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: {{ include "swck.adapter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# ...and read the extension-apiserver-authentication ConfigMap in kube-system to
# learn the client CA it must trust. This RoleBinding is the one resource this
# chart creates outside the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "swck.componentName" (list . "custom-metrics-auth-reader") }}
  namespace: kube-system
  labels:
    {{- include "swck.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
- kind: ServiceAccount
  name: {{ include "swck.adapter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "swck.componentName" (list . "custom-metrics-resource-reader") }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - nodes
  - nodes/stats
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "swck.componentName" (list . "custom-metrics-resource-reader") }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "swck.componentName" (list . "custom-metrics-resource-reader") }}
subjects:
- kind: ServiceAccount
  name: {{ include "swck.adapter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# The HPA controller is the consumer of the metrics this adapter serves, so it is
# the subject that needs read access to the external.metrics.k8s.io API group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "swck.componentName" (list . "custom-metrics-server-resources") }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
rules:
- apiGroups:
  - custom.metrics.k8s.io
  - external.metrics.k8s.io
  resources:
  - '*'
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "swck.componentName" (list . "custom-metrics-hpa-controller") }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "swck.componentName" (list . "custom-metrics-server-resources") }}
subjects:
- kind: ServiceAccount
  name: horizontal-pod-autoscaler
  namespace: kube-system
{{- end }}
