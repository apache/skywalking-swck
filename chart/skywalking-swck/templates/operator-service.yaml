{{- if .Values.operator.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swck.componentName" (list . "controller-manager-metrics-service") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swck.operator.labels" . | nindent 4 }}
spec:
  ports:
  - name: https
    port: {{ .Values.operator.metrics.service.port }}
    protocol: TCP
    targetPort: https
  selector:
    {{- include "swck.operator.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if .Values.operator.webhook.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swck.componentName" (list . "webhook-service") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: {{ .Values.operator.webhook.service.port }}
  selector:
    {{- include "swck.operator.selectorLabels" . | nindent 4 }}
{{- end }}
