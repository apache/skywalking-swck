{{- if .Values.adapter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swck.componentName" (list . "custom-metrics-apiserver") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swck.labels" . | nindent 4 }}
spec:
  ports:
  - name: https
    port: 443
    targetPort: {{ .Values.adapter.service.port }}
  selector:
    {{- include "swck.adapter.selectorLabels" . | nindent 4 }}
---
# v1beta1.external.metrics.k8s.io is a CLUSTER-WIDE singleton: exactly one
# external metrics provider can own it. Installing this chart with
# adapter.enabled=true in a cluster that already runs prometheus-adapter, KEDA or
# another external metrics provider takes that API group away from it.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
  labels:
    {{- include "swck.labels" . | nindent 4 }}
spec:
  group: external.metrics.k8s.io
  version: v1beta1
  groupPriorityMinimum: 100
  versionPriority: 100
  # The adapter serves a certificate it signs itself, so the aggregation layer
  # has nothing to verify it against.
  insecureSkipTLSVerify: true
  service:
    name: {{ include "swck.componentName" (list . "custom-metrics-apiserver") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
