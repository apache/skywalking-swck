apiVersion: v2
type: application
name: skywalking-swck
description: SkyWalking Cloud on Kubernetes -- the SkyWalking operator and its custom metrics adapter
home: https://github.com/apache/skywalking-swck
icon: https://raw.githubusercontent.com/apache/skywalking-kubernetes/master/logo/sw-logo-for-chart.jpg
# The chart is released from, and versioned with, the operator it deploys.
version: 0.12.0
appVersion: "0.12.0"
# The floor the repository documents and the e2e suite runs against
# (test/e2e/kind.yaml pins kindest/node:v1.21.10).
kubeVersion: ">=1.21.0-0"
keywords:
  - skywalking
  - operator
  - apm
  - observability
  - custom-metrics
sources:
  - https://github.com/apache/skywalking-swck
maintainers:
  - name: Apache SkyWalking
    url: https://skywalking.apache.org
