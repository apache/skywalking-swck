apiVersion: operator.skywalking.apache.org/v1alpha1
kind: BanyanDB
metadata:
  name: banyandb-test
spec:
  version: 1.0.0
  counts: 1
  image: ${BANYANDB_IMAGE}
  config:
    - "standalone"
    # --metadata-root-path went away with etcd (apache/skywalking-banyandb#1057); the schema server
    # took its place. BanyanDB exits on an unknown flag, so the old name is not ignored -- it stops
    # the database from starting at all, and the OAP then fails on a refused connection.
    - "--measure-root-path=/data/banyandb"
    - "--stream-root-path=/data/banyandb"
    - "--schema-server-root-path=/data/banyandb"
  storages:
    - name: banyandb-volume
      path: "/data/banyandb"
      persistentVolumeClaimSpec:
        resources:
          requests:
            storage: 1Gi
        volumeMode: Filesystem
        accessModes:
          - ReadWriteOnce
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: storage
            operator: In
            values:
            - banyandb
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: banyandb-pv
  labels:
    type: local
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Recycle
  hostPath:
    path: "/tmp/banyandb/data1"
