apiVersion: operator.skywalking.apache.org/v1alpha1
kind: OAPServer
metadata:
  name: skywalking-system
  namespace: skywalking-system
spec:
  version: 11.0.0
  instances: 1
  image: ${OAP_IMAGE}
  # No supported OAP has an embedded storage -- H2 went in 10.2.0 -- and there is no fallback;
  # test/e2e/banyandb-storage.yaml provides one.
  storage:
    name: storage
  service:
    template:
      type: ClusterIP

---
apiVersion: operator.skywalking.apache.org/v1alpha1
kind: EventExporter
metadata:
  name: skywalking-system
  namespace: skywalking-system
spec:
  replicas: 1
  # `version` alone would leave the operator to build
  # apache/skywalking-kubernetes-event-exporter:<version> from Docker Hub, which is how `latest`
  # got in here. The explicit image is what test/e2e/env pins.
  version: latest
  image: ${EVENT_EXPORTER_IMAGE}
  config: |
    filters:
      - reason: ""     
        message: ""    
        minCount: 1    
        type: ""       
        action: ""     
        kind: "Pod|Service"
        namespace: "^skywalking-system$"  
        name: ""       
        service: "[^\\s]{1,}"  
        exporters:     
          - skywalking 
    exporters:         
      skywalking:      
        template:      
          source:
            service: "{{ .Service.Name }}"
            serviceInstance: "{{ .Pod.Name }}"
            endpoint: ""
          message: "{{ .Event.Message }}" 
        address: "skywalking-system-oap.skywalking-system:11800"

