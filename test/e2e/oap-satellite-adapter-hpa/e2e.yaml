setup:
  env: kind
  file: ../kind.yaml
  # Every SkyWalking image this case deploys is pinned in ../env; see docs/en/guides/e2e.md.
  init-system-environment: ../env
  steps:
    - name: prepare e2e.yaml
      command: bash test/tools/prepare-e2e.sh
    - name: install cert-manager
      command: |
        # kind k8s cluster is in $TMPDIR
        export KUBECONFIG=$TMPDIR/e2e-k8s.config
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.11.5/cert-manager.yaml
      wait:
        - namespace: cert-manager
          resource: pod
          for: condition=Ready
    - name: install operator and metrics-adapter
      command: |
        export OPERATOR_IMG=controller:latest
        export ADAPTER_IMG=metrics-adapter:latest
        make -C operator docker-build
        make -C adapter docker-build
        kind load docker-image controller:latest
        kind load docker-image metrics-adapter:latest
        helm install skywalking-swck chart/skywalking-swck \
          --namespace skywalking-swck-system --create-namespace \
          --set operator.image.repository=controller \
          --set operator.image.tag=latest \
          --set operator.image.pullPolicy=IfNotPresent \
          --set adapter.enabled=true \
          --set adapter.image.repository=metrics-adapter \
          --set adapter.image.tag=latest \
          --set adapter.image.pullPolicy=IfNotPresent \
          --set adapter.oap.address=http://skywalking-system-oap.skywalking-system:12800/graphql \
          --wait --timeout 10m
      wait:
        - namespace: skywalking-swck-system
          resource: pod
          for: condition=Ready
    # SkyWalking has had no embedded storage since 10.2.0, so every OAP version this operator
    # supports needs a real storage before it can start. There is no fallback.
    - name: setup banyandb storage
      command: |
        kubectl create namespace skywalking-system --dry-run=client -o yaml | kubectl apply -f -
        envsubst "$E2E_IMAGES" < test/e2e/banyandb-storage.yaml | kubectl apply -f -
        # The operator turns the BanyanDB resource into a Deployment, which takes a moment, and
        # `kubectl wait` fails outright rather than retrying when nothing matches yet. Wait for the
        # Deployment to exist before asking the framework to wait for it to be ready.
        for _ in $(seq 1 60); do
          kubectl get deployment storage-banyandb -n skywalking-system >/dev/null 2>&1 && break
          sleep 2
        done
      wait:
        - namespace: skywalking-system
          resource: deployment/storage-banyandb
          for: condition=Available
    - name: setup oapserver and ui
      command: |
        kubectl create namespace skywalking-system --dry-run=client -o yaml | kubectl apply -f -
        # This case drives the HPA from satellite metrics and never opens the UI, so deploy only
        # the first two documents -- the OAPServer and the Satellite -- and leave the UI out.
        envsubst "$E2E_IMAGES" < test/e2e/skywalking-components-with-satellite.yaml | awk '/^---$/{doc++} doc<2' | kubectl apply -f -
      wait:
        - namespace: skywalking-system
          resource: OAPServer/skywalking-system
          for: condition=Available
        - namespace: skywalking-system
          resource: Satellite/skywalking-system
          for: condition=Available
    - name: setup java agent demo
      command: |
        kubectl label namespace skywalking-system swck-injection=enabled
        envsubst "$E2E_IMAGES" < test/e2e/demo.yaml | sed 's/oap-service/skywalking-system-satellite.skywalking-system/' | kubectl create -f -
      wait:
        - namespace: skywalking-system
          resource: deployment/demo
          for: condition=Available
    - name: setup the hpa of java agent demo
      command: |
        kubectl apply -f test/e2e/satellite-hpa-demo.yaml
    - name: increase the satellite connection count
      command: |
        kubectl -n skywalking-system scale deployment/demo --replicas 5
        kubectl rollout status --watch --timeout=120s deployment/demo -n skywalking-system
  kind:
    expose-ports:
      - namespace: skywalking-system
        resource: service/demo 
        port: 8085
      - namespace: skywalking-system
        resource: service/skywalking-system-oap
        port: 12800
  timeout: 20m

trigger:
  action: http
  interval: 30s
  times: 30
  url: http://${service_demo_host}:${service_demo_8085}/hello
  method: GET

verify:
  # verify with retry strategy
  retry:
    # max retry count
    count: 15
    # the interval between two attempts, e.g. 10s, 1m.
    interval: 15s
  cases:
    - query: swctl --display yaml --base-url=http://${service_skywalking_system_oap_host}:${service_skywalking_system_oap_12800}/graphql metrics linear --name satellite_service_grpc_connect_count --service-name satellite-service | yq e 'to_entries' -
      expected: ../verify/satellite-hpa-metrics.yaml
    # the trigger will do 30 times, as the hpa's value is set as 5, so the deployment's replicas will be 3(maxReplicas).
    - query: 'kubectl get deployment skywalking-system-satellite -n skywalking-system -o jsonpath=''{.status.replicas}'' | yq e ''{"replicas": .}'' - | yq e ''to_entries'' -'
      expected: ../verify/satellite-replicas.yaml