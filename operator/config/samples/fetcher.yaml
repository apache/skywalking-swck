apiVersion: operator.skywalking.apache.org/v1alpha1
kind: Fetcher
metadata:
  name: istio-prod-cluster
spec:
  type: ["prometheus"]
  OAPServerAddress: "default-oap:11800"
  clusterName: "istio-prod-cluster"

---
# No supported OAP has an embedded storage -- SkyWalking removed H2 in 10.2.0 -- and there is no
# fallback, so every sample brings a BanyanDB along.
apiVersion: operator.skywalking.apache.org/v1alpha1
kind: BanyanDB
metadata:
  name: default
spec:
  version: 0.11.0
  counts: 1
  image: apache/skywalking-banyandb:0.11.0
  config:
    - "standalone"
---
apiVersion: operator.skywalking.apache.org/v1alpha1
kind: Storage
metadata:
  name: default
spec:
  type: banyandb
  connectType: external
  address: default-banyandb-grpc.default:17912
  version: 0.11.0
---
apiVersion: operator.skywalking.apache.org/v1alpha1
kind: OAPServer
metadata:
  name: default
spec:
  version: 11.0.0
  instances: 1
  image: apache/skywalking-oap-server:11.0.0
  storage:
    name: default
  config:
    - name: SW_OTEL_RECEIVER
      value: default
  service:
    template:
      type: ClusterIP

---
apiVersion: operator.skywalking.apache.org/v1alpha1
kind: UI
metadata:
  name: default
spec:
  kind: horizon
  version: 1.0.0
  instances: 1
  image: apache/skywalking-ui:horizon-1.0.0
  OAPServerAddress: http://default-oap.default:12800
  service:
    template:
      type: ClusterIP
    ingress:
      host: demo.ui.skywalking
