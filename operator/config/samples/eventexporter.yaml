apiVersion: operator.skywalking.apache.org/v1alpha1
kind: EventExporter
metadata:
  name: eventexporter-sample
spec:
  replicas: 1
  config: |
    filters:
      - reason: ""     
        message: ""    
        minCount: 1    
        type: ""       
        action: ""     
        kind: "Pod|Service"       
        namespace: "^default$"  
        name: ""       
        service: "[^\\s]{1,}"  
        exporters:     
          - skywalking
    exporters:         
      skywalking:      
        template:      
          source:
            service: "{{ .Service.Name }}"
            serviceInstance: "{{ .Pod.Name }}"
            endpoint: ""
          message: "{{ .Event.Message }}" 
        address: "default-oap:11800"

---
# No supported OAP has an embedded storage -- SkyWalking removed H2 in 10.2.0 -- and there is no
# fallback, so every sample brings a BanyanDB along.
apiVersion: operator.skywalking.apache.org/v1alpha1
kind: BanyanDB
metadata:
  name: default
spec:
  version: 0.11.0
  counts: 1
  image: apache/skywalking-banyandb:0.11.0
  config:
    - "standalone"
---
apiVersion: operator.skywalking.apache.org/v1alpha1
kind: Storage
metadata:
  name: default
spec:
  type: banyandb
  connectType: external
  address: default-banyandb-grpc.default:17912
  version: 0.11.0
---
apiVersion: operator.skywalking.apache.org/v1alpha1
kind: OAPServer
metadata:
  name: default
spec:
  version: 11.0.0
  instances: 1
  image: apache/skywalking-oap-server:11.0.0
  storage:
    name: default
  service:
    template:
      type: ClusterIP